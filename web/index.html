<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Google Drive Uploader</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="bg-slate-900 text-slate-100 min-h-screen">
    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50">
      <div class="container mx-auto px-4 py-4">
        <div class="flex items-center justify-between">
          <div class="flex items-center space-x-3">
            <svg
              class="w-8 h-8 text-blue-500"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"
              />
            </svg>
            <h1 class="text-2xl font-bold">Google Drive Uploader</h1>
          </div>
          <div class="flex items-center space-x-4">
            <div id="connection-status" class="flex items-center space-x-2">
              <div
                id="status-dot"
                class="w-3 h-3 rounded-full bg-red-500"
              ></div>
              <span id="status-text" class="text-sm text-slate-400"
                >Disconnected</span
              >
            </div>
            <button
              id="theme-toggle"
              class="p-2 rounded-lg bg-slate-700 hover:bg-slate-600 transition-colors"
              title="Toggle theme"
            >
              <svg
                class="w-5 h-5"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
                />
              </svg>
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-6 space-y-6">
      <!-- Connection Bar -->
      <section class="bg-slate-800 rounded-lg p-6 shadow-lg">
        <h2 class="text-lg font-semibold mb-4">Server Connection</h2>
        <div class="flex gap-3">
          <input
            type="text"
            id="server-url"
            placeholder="http://localhost:5000"
            class="flex-1 px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-100 placeholder-slate-400"
          />
          <button
            id="connect-btn"
            class="px-6 py-2 bg-blue-500 hover:bg-blue-600 rounded-lg font-medium transition-colors"
          >
            Connect
          </button>
        </div>
        <p class="text-sm text-slate-400 mt-2">
          Enter your server URL and click Connect to start
        </p>
      </section>

      <!-- URL Input Section -->
      <section class="bg-slate-800 rounded-lg p-6 shadow-lg">
        <h2 class="text-lg font-semibold mb-4">Add Download</h2>
        <div class="space-y-4">
          <div>
            <label for="url-input" class="block text-sm font-medium mb-2"
              >URL(s)</label
            >
            <textarea
              id="url-input"
              rows="4"
              placeholder="Paste one or more URLs here (one per line)&#10;https://example.com/file.zip&#10;https://youtube.com/watch?v=..."
              class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-100 placeholder-slate-400 font-mono text-sm"
            ></textarea>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label for="folder-select" class="block text-sm font-medium mb-2"
                >Destination Folder</label
              >
              <div class="flex gap-2">
                <select
                  id="folder-select"
                  class="flex-1 px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-100"
                >
                  <option value="">Root</option>
                </select>
                <button
                  id="new-folder-btn"
                  class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg border border-slate-600 transition-colors"
                  title="Create new folder"
                >
                  <svg
                    class="w-5 h-5"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M12 4v16m8-8H4"
                    />
                  </svg>
                </button>
              </div>
            </div>

            <div>
              <label for="format-select" class="block text-sm font-medium mb-2"
                >Video Format (optional)</label
              >
              <select
                id="format-select"
                class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-100"
              >
                <option value="">Best Quality</option>
                <option value="bestvideo+bestaudio">Best Video + Audio</option>
                <option value="1080p">1080p</option>
                <option value="720p">720p</option>
                <option value="480p">480p</option>
                <option value="bestaudio">Audio Only</option>
              </select>
            </div>
          </div>

          <button
            id="add-queue-btn"
            class="w-full py-3 bg-green-500 hover:bg-green-600 rounded-lg font-semibold text-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
            disabled
          >
            Add to Queue
          </button>
        </div>
      </section>

      <!-- Active Downloads -->
      <section class="bg-slate-800 rounded-lg p-6 shadow-lg">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-lg font-semibold">Active Downloads</h2>
          <span
            id="active-count"
            class="px-3 py-1 bg-blue-500 rounded-full text-sm font-medium"
            >0</span
          >
        </div>
        <div id="active-downloads" class="space-y-3">
          <div class="text-center py-8 text-slate-400">
            No active downloads
          </div>
        </div>
      </section>

      <!-- Completed Downloads -->
      <section class="bg-slate-800 rounded-lg p-6 shadow-lg">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-lg font-semibold">Completed</h2>
          <div class="flex items-center gap-3">
            <span
              id="completed-count"
              class="px-3 py-1 bg-green-500 rounded-full text-sm font-medium"
              >0</span
            >
            <button
              id="toggle-completed"
              class="text-sm text-blue-400 hover:text-blue-300"
            >
              Show
            </button>
            <button
              id="clear-completed"
              class="text-sm text-red-400 hover:text-red-300"
            >
              Clear
            </button>
          </div>
        </div>
        <div id="completed-downloads" class="space-y-2 hidden">
          <div class="text-center py-4 text-slate-400">
            No completed downloads
          </div>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-800 border-t border-slate-700 mt-8">
      <div class="container mx-auto px-4 py-4">
        <div class="space-y-2">
          <div class="flex items-center justify-between text-sm">
            <span class="text-slate-400">Storage Quota</span>
            <span id="quota-text" class="font-medium">-- / --</span>
          </div>
          <div class="w-full bg-slate-700 rounded-full h-2">
            <div
              id="quota-bar"
              class="bg-blue-500 h-2 rounded-full transition-all"
              style="width: 0%"
            ></div>
          </div>
          <div class="text-xs text-slate-500 text-center">
            Google Drive Uploader v1.0 | Built with Tailwind CSS
          </div>
        </div>
      </div>
    </footer>

    <!-- Toast Container -->
    <div
      id="toast-container"
      class="fixed bottom-4 right-4 space-y-2 z-50"
    ></div>

    <!-- Modal for New Folder -->
    <div
      id="new-folder-modal"
      class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50"
    >
      <div class="bg-slate-800 rounded-lg p-6 w-full max-w-md mx-4">
        <h3 class="text-lg font-semibold mb-4">Create New Folder</h3>
        <input
          type="text"
          id="new-folder-name"
          placeholder="Folder name"
          class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-100 mb-4"
        />
        <div class="flex gap-3 justify-end">
          <button
            id="cancel-folder-btn"
            class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg transition-colors"
          >
            Cancel
          </button>
          <button
            id="create-folder-btn"
            class="px-4 py-2 bg-blue-500 hover:bg-blue-600 rounded-lg transition-colors"
          >
            Create
          </button>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
