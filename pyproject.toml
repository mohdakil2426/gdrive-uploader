[project]
name = "gdrive-uploader"
version = "2.1.0"
description = "Universal Google Drive Uploader - Downloads files from URLs directly to Google Drive"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "SIM", "ARG"]
ignore = [
    "E501",  # Line too long (handled by formatter)
]

[tool.pylint.main]
# No exclusions - lint everything

[tool.pylint.messages_control]
disable = [
    "no-member",  # Google API uses dynamic attributes (Resource.files())
    "too-many-ancestors",  # GUI frameworks have deep inheritance
    "too-many-instance-attributes",  # GUI apps need many attributes
    "too-many-arguments",  # Some constructors need many args
    "too-many-positional-arguments",  # Same as above
    "duplicate-code",  # Single-file design intentionally duplicates some code
]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.design]
max-args = 10
max-attributes = 15

# =============================================================================
# PYREFLY FALSE POSITIVES (Not real bugs)
# =============================================================================
# These errors are expected and can be ignored:
#
# 1. missing-attribute: self.service.files()
#    - Google API Resource class uses dynamic attributes
#    - Works correctly at runtime
#
# 2. missing-import: google.colab
#    - Only available in Google Colab environment
#    - Not installed locally (and shouldn't be)
#
# 3. bad-argument-type: yt_dlp.YoutubeDL(ydl_opts)
#    - yt-dlp has complex type signatures
#    - Works correctly at runtime
#
# 4. unbound-name: result
#    - False positive - variable is always set in the loop
#
# 5. unsupported-operation: dict assignment
#    - Type inference limitation with JSON data
# =============================================================================
